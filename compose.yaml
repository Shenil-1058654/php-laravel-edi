services:
  php:
    image: registry.gitlab.com/2makeitwork/docker-registry:php-8.3
    ports:
      - '80:80'
    volumes:
      - ./app:/var/www/html/
      - ./private_secret:/var/www/private_secret/
      - ./exports:/var/www/exports/
      - ./imports:/var/www/imports/
      - ./edi_files:/var/www/edi_files/
      - ./lsp:/var/www/lsp/
    env_file:
      - path: ./.env
  mysql:
    image: mariadb:latest
    command: '--default-authentication-plugin=mysql_native_password'
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf
    restart: no
    container_name: mariadb-duc-edi
    hostname: mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=gitlab_test_database_password
      - MYSQL_DATABASE=${DBNAME}
      - MYSQL_USER=${DBUSER}
      - MYSQL_PASSWORD=${DBPASS}
    ports:
      - '3306:3306'
    expose:
      - 3306
      - 33060
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect" ]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 3
  phpmyadmin:
    image: phpmyadmin
    restart: no
    ports:
      - 8080:80
    environment:
      - PMA_ARBITRARY=1
      - UPLOAD_LIMIT=300M
  flyway:
    image: flyway/flyway:latest
    container_name: duc_edi_flyway
    command: -configFiles=/flyway/conf/flyway.conf migrate
    environment:
      FLYWAY_URL: jdbc:mysql://host.docker.internal:3306/test_database
      FLYWAY_USER: test_user
      FLYWAY_PASSWORD: gitlab_test_database_password
    volumes:
      - ./flyway/conf:/flyway/conf
      - ./flyway/sql:/flyway/sql
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  db_data: